# Config file for Ducted ISAE4 in hover

master_path: /scratch/jmrendon/EDAT-McGill/4e-5_6000rpm
case: EDAT-McGill

files:
  inst_force: EDAT-McGill_inst-forces_rotor.h5
  avg_force: RA-beam-no-interaction_avg_forces_rotor.h5
  inst_pressure: EDAT-McGill_inst-pressure_rotor.h5
  avg_pressure: EDAT-nosimplification_avg-pressure_rotor.h5

rotor:
  r_tip: 0.075
  rho_ref: 1.22523
  rpm: 6000
  pref: 101325
  c_ref: 0.0125 # reference chord [m], used only when normalize is true below

# True if NDA is applied
normalize: false

# Raw Cartesian axis (0=X, 1=Y, 2=Z) for each blade direction (this
# project's original isolated-rotor convention).
axes:
  span: 0
  chord: 1
  thickness: 2
  skip_validation: true # set True if you have a highly swept blade

crop:
  span_min: 0.015

friction:
  reverse_chord: false
  radii: [0.025, 0.040, 0.050, 0.070, 0.075]

convergence:
  dt_forces: 0.0000554
  dt_pressure: 0.00005 

blade_figsize: null # null for ISAE2 case

frame_loop_step: 90
