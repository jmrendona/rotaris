# Config file for SAGE simulations of rotor in hover

master_path: /scratch/jmrendon/DuctedFan/ductedfan_12e-5_vr12
case: SAGE

files:
  inst_force: SAGE_forces_rotor.h5
  avg_force: RA-beam-no-interaction_avg_forces_rotor.h5
  inst_pressure: SAGE_pressure_rotor.h5
  avg_pressure: EDAT-nosimplification_avg-pressure_rotor.h5

rotor:
  r_tip: 0.3040
  rho_ref: 1.22523
  rpm: 5252
  pref: 101325
  c_ref: null # reference chord [m], used only when normalize is true below

# True if NDA is applied
normalize: false

# Raw Cartesian axis (0=X, 1=Y, 2=Z) for each blade direction (this
# project's original isolated-rotor convention).
axes:
  span: 0
  chord: 1
  thickness: 2
  skip_validation: true # set True if you have a highly swept blade

crop:
  span_min: null

friction:
  reverse_chord: false
  radii: [0.1, 0.21, 0.25, 0.27, 0.29]

convergence:
  dt_pressure: 0.0000488
  dt_forces: 0.000063468 
  
blade_figsize: null # null for ISAE2 case

frame_loop_step: 90
