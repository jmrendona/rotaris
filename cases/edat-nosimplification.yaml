# Config file for EDAT simulations of rotor in hover

master_path: /scratch/jmrendon/EDAT/Iteration2/no-simplifications-VR12
case: EDAT-nosimplification

files:
  inst_force: EDAT-nosimplification_forces_rotor.h5
  avg_force: RA-beam-no-interaction_avg_forces_rotor.h5
  inst_pressure: EDAT-nosimplification_pressure_rotor.h5
  avg_pressure: EDAT-nosimplification_avg-pressure_rotor.h5

rotor:
  r_tip: 0.39167
  rho_ref: 1.22523
  rpm: 3500
  pref: 101325
  c_ref: 0.05 # reference chord [m], used only when normalize is true below

# True if NDA is applied
normalize: false

# Raw Cartesian axis (0=X, 1=Y, 2=Z) for each blade direction (this
# project's original isolated-rotor convention).
axes:
  span: 0
  chord: 1
  thickness: 2
  skip_validation: true # set True if you have a highly swept blade

crop:
  span_min: null

friction:
  reverse_chord: true
  radii: [0.098, 0.196, 0.2937, 0.3525, 0.372]

convergence:
  dt_pressure: 0.0000503
  dt_forces: 0.00009524 # 

blade_figsize: null # null for ISAE2 case

frame_loop_step: 90
