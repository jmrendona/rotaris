# Config file for ISAE2 simulations of isolated rotor in hover

master_path: /scratch/jmrendon/Rotor-alone/6e-5_6000rpm-transition_PL
case: 2025T

# 'rotor' (default, can be omitted), 'stator', 'beam', or 'casing' - which
# kind of part this case's .snc/HDF5 data is for (see convert.py's
# --object). Rotor/stator use rotor.rpm for Cf/Cp's local q_ref; a
# stator/beam/casing case instead needs rotor.v_ref (q_ref uniform,
# 0.5*rho_ref*v_ref^2 - see bladeprocessor._dynamics.dynamic_pressure),
# since it has no rotation rate of its own. rotor.rpm can still be set on
# a stator/beam/casing case purely as the phase-lock period clock (the
# rotor's blade-passing rate still drives a stationary part's unsteady
# loads) - that use is independent of v_ref.
# object_type: rotor

files:
  inst_force: 2026DNS_forces_rotor.h5
  avg_force: RA-beam-no-interaction_avg_forces_rotor.h5
  inst_pressure: 2026DNS_pressure_rotor.h5
  avg_pressure: RA-beam_avg_pressure_rotor.h5

rotor:
  r_tip: 0.125
  rho_ref: 1.22523
  rpm: 6000
  pref: 101325
  c_ref: 0.025 # reference chord [m], used only when normalize is true below
  # v_ref: 10.0 # freestream/inlet velocity [m/s] - stator/beam/casing cases only, see above

# No NDA on this case - plots show actual physical radius/chord/units.
normalize: true

# Raw Cartesian axis (0=X, 1=Y, 2=Z) for each blade direction (this
# project's original isolated-rotor convention).
axes:
  span: 0
  chord: 2
  thickness: 1
  skip_validation: true # set True if you have a highly swept blade

crop:
  span_min: 0.02
  azimuth_center_deg: 0
  azimuth_tol_deg: 45

friction:
  reverse_chord: true
  radii: [0.045, 0.072, 0.100, 0.117, 0.122]

convergence:
  dt_pressure: 0.000005
  dt_forces: 0.0000556 

blade_figsize: null # null for ISAWE2 case

frame_loop_step: 5
