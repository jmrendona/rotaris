# Config file for ISAE2 simulations of isolated rotor in hover

master_path: /scratch/jmrendon/Rotor-alone/1e-5_6000rpm-dns
case: 2026DNS

files:
  inst_force: 2026DNS_forces_rotor.h5
  avg_force: RA-beam-no-interaction_avg_forces_rotor.h5
  inst_pressure: 2026DNS_pressure_rotor.h5
  avg_pressure: RA-beam_avg_pressure_rotor.h5

rotor:
  r_tip: 0.125
  rho_ref: 1.22523
  rpm: 6000
  pref: 101325
  c_ref: 0.025 # reference chord [m], used only when normalize is true below

# No NDA on this case - plots show actual physical radius/chord/units.
normalize: false

# Raw Cartesian axis (0=X, 1=Y, 2=Z) for each blade direction (this
# project's original isolated-rotor convention).
axes:
  span: 0
  chord: 2
  thickness: 1
  skip_validation: true # set True if you have a highly swept blade

crop:
  span_min: 0.02
  # This case's forces file (2026DNS_forces_rotor.h5) also combines BOTH
  # blades in one Geometry/Upper,Lower group (confirmed: azimuth
  # histogram peaks at ~0deg and ~180deg, ~23.6M/23.0M points each after
  # span_min=0.02; the pressure file is presumably the same). span_min
  # ALONE has been accidentally isolating one blade for span_axis=0 (X)
  # callers (FrictionLines/StripForces load-time crop, SurfaceVariable's
  # own per-call span_min on plot_variable_surface/cp/etc.) - a positive
  # span_min excludes azimuth~180deg's blade entirely, since it sits on
  # the negative-centered-X side (confirmed: 0 points from that blade
  # survive span_min=0.02). That's a coincidence of this blade pair's
  # own orientation relative to span_axis=X, not a general property of
  # span_min, and it does NOT protect anything built from RADIUS instead
  # (unsigned - same for both blades) - confirmed to miss exactly this:
  # pressure_manager.py's own Cp POD pod_region used radius_sv
  # specifically (switched away from span_sv in a past fix for an
  # unrelated reason - see that file's own comment), so it had NO blade
  # separation and was mixing both blades' pressure data together.
  # azimuth_center_deg/azimuth_tol_deg below give every class an
  # EXPLICIT, non-accidental blade crop instead - see
  # bladeprocessor._azimuth.azimuth_deg for the angle convention.
  azimuth_center_deg: 0
  azimuth_tol_deg: 45

friction:
  reverse_chord: true
  radii: [0.045, 0.072, 0.100, 0.117, 0.122]

convergence:
  dt_pressure: 0.000005
  dt_forces: 0.0000556 

blade_figsize: null # null for ISAWE2 case

frame_loop_step: 5
