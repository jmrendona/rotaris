# Config file for Tayyab's configuration of 5b fan with shroud in hover

master_path: /scratch/jmrendon/tayyab
case: 5b_fan_shroud

files:
  inst_force: 5b_forces.h5
  avg_force: 2025HF_avg_forces_blade5.h5
  inst_pressure: 5b_pressure.h5
  avg_pressure: 2025HF_avg_pressure_blade5.h5

rotor:
  r_tip: 0.178
  rho_ref: 1.22523
  rpm: 3555
  pref: 101325
  c_ref: null # reference chord [m] - set this before using normalize: true

# No NDA on this case - plots show actual physical radius/chord/units.
normalize: false

# Raw Cartesian axis (0=X, 1=Y, 2=Z) for each blade direction. Rotation axis
# is X here, radius correlates -0.98 with Z, and X has the highest mean
# |normal component| (0.754) - so X = thickness, Z = span, Y = chord.
axes:
  span: 2
  chord: 1
  thickness: 0
  skip_validation: true # set True if you have a highly swept blade

crop:
  span_min: null # null if the full extend will be used

friction:
  reverse_chord: false
  radii: [0.085, 0.1, 0.125, 0.150, 0.17]

convergence:
  dt_forces: 0.00002692
  dt_pressure: null # To define

blade_figsize: [7, 5.5] # null for ISAE2 case

frame_loop_step: 15
