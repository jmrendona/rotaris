# Config file for ISAE2 simulations of isolated rotor in hover

master_path: /scratch/jmrendon/Rotor-strut/14mm/diametral
case: RS-14mm-diametral

files:
  inst_force: RS-14mm-diametral_inst-forces.h5
  avg_force: RA-beam-no-interaction_avg_forces_rotor.h5
  inst_pressure: RS-14mm-diametral_inst-pressure.h5
  avg_pressure: RA-beam_avg_pressure_rotor.h5

rotor:
  r_tip: 0.125
  rho_ref: 1.22523
  rpm: 6420
  pref: 101325
  c_ref: 0.025 # reference chord [m], used only when normalize is true below

# No NDA on this case - plots show actual physical radius/chord/units.
normalize: false

# Raw Cartesian axis (0=X, 1=Y, 2=Z) for each blade direction (this
# project's original isolated-rotor convention).
axes:
  span: 0
  chord: 2
  thickness: 1
  skip_validation: true # set True if you have a highly swept blade

crop:
  span_min: null
  # This case's "rotor.Default-Segment" face combines BOTH blades (180
  # deg apart) - no per-blade face_name exists to select one at
  # conversion time, and span_min/span_max can't separate them either
  # (both blades span the SAME physical radius range) - confirmed via
  # a bimodal azimuth histogram (~745k surfels each at azimuth~0deg and
  # azimuth~180deg) and visually (cf_surface_inst_upper_frame1000's own
  # overlapping-blade artifact). Selecting azimuth~0deg here - see
  # bladeprocessor._azimuth.azimuth_deg for the angle convention
  # (0deg = toward global +X, measured around the rotor's own rotation
  # axis) and FrictionLines/StripForces/SurfaceVariable's own
  # azimuth_center_deg/azimuth_tol_deg docstrings.
  azimuth_center_deg: 0
  azimuth_tol_deg: 45

friction:
  reverse_chord: true
  radii: [0.045, 0.072, 0.100, 0.117, 0.122]

convergence:
  dt_pressure: 0.000005
  dt_forces: 0.0000556 

blade_figsize: null # null for ISAWE2 case

frame_loop_step: 1000
